
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody - Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="player">

        <header class="header">
            <div class="brand">
                <span class="brand-icon">♫</span>
                <h2>Melody</h2>
            </div>
            <span class="tag">MUSIC PLAYER</span>
        </header>

        <section class="cover">
            <div class="disc">
                <span>♫</span>
            </div>
        </section>

        <section class="song-info">
            <h2 id="title">Select a song</h2>
            <p id="artist">Your music library</p>
        </section>

        <section class="progress-area">
            <input type="range" id="progress"
                   min="0" max="100" value="0">

            <div class="time">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </section>

        <section class="controls">
            <button id="prev" title="Previous">⏮</button>
            <button id="play" class="play-btn" title="Play">▶</button>
            <button id="next" title="Next">⏭</button>
        </section>

        <section class="volume-area">
            <span>🔈</span>
            <input type="range" id="volume"
                   min="0" max="1" step="0.01" value="0.7">
            <span>🔊</span>
        </section>

        <section class="playlist-section">
            <div class="playlist-heading">
                <h3>My Playlist</h3>
                <span id="song-count">0 Songs</span>
            </div>

            <div id="playlist" class="playlist"></div>
        </section>

        <audio id="audio" preload="metadata"></audio>

    </main>

    <script src="script.js"></script>
</body>
</html>
